{% macro status_badge(v) -%}
{%- if v == 'OK' -%}<span class="badge" style="background:#dcfce7; color:#166534;">OK</span>
{%- elif v == 'WARN' -%}<span class="badge" style="background:#fef3c7; color:#92400e;">UYARI</span>
{%- elif v == 'FAIL' -%}<span class="badge" style="background:#fee2e2; color:#b91c1c;">FAIL</span>
{%- else -%}<span class="badge" style="background:#f1f5f9; color:#64748b;">YOK</span>{%- endif -%}
{%- endmacro %}
