# Drop-in: staging writes backups / 5651 archive under its own tree (never /var/backups/radius).
# Install: /etc/systemd/system/emredius-staging.service.d/paths.conf, then systemctl daemon-reload.
[Service]
Environment=BACKUP_DIR=/opt/emredius_stage/var/backups
Environment=ARCHIVE_5651_DIR=/opt/emredius_stage/var/5651
Environment=SOURCE_BUNDLE_PATH=/opt/emredius_stage/var/emredius_source_bundle.tar.gz
Environment=PANEL_UNIT=emredius-staging.service
